name: Verify and deploy Just Share Android

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Verification only, Internal testing, or closed Alpha
        required: true
        default: verify-only
        type: choice
        options: [verify-only, internal, closed-alpha]

permissions:
  contents: read

concurrency:
  group: justshare-android-${{ github.ref }}
  cancel-in-progress: true

env:
  AAB_PATH: app/build/outputs/bundle/release/app-release.aab
  QUOTA_API_BASE_URL: https://api.justshare.blackandblue.co.in
  CF_RELAY_BASE_URL: wss://relay.justshare.blackandblue.co.in
  CF_RELAY_ENABLED: "true"

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$DEPLOY_TARGET" != 'verify-only' ]]; then
            [[ "$SOURCE_REF" == 'refs/heads/main' ]] || { echo 'Play testing deployments must run from main.' >&2; exit 1; }
          fi

  quality:
    needs: release-policy
    runs-on: ubuntu-latest
    env:
      JUSTSHARE_REVENUECAT_API_KEY: goog_validation_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests, lint, and unsigned release verification
        run: ./gradlew test lint :app:assembleRelease --stacktrace

  device:
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Connected checks on API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedCheck --stacktrace

  deploy-testing:
    needs: [quality, device]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.deploy_target == 'internal' || inputs.deploy_target == 'closed-alpha')
    runs-on: ubuntu-latest
    environment: testing
    env:
      JUSTSHARE_KEYSTORE_PATH: upload-keystore.jks
      JUSTSHARE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      JUSTSHARE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      JUSTSHARE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      JUSTSHARE_REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_SDK_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate protected inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(KEYSTORE_BASE64)
          [[ -n "$JUSTSHARE_KEYSTORE_PASSWORD" ]] || missing+=(KEYSTORE_PASSWORD)
          [[ -n "$JUSTSHARE_KEY_ALIAS" ]] || missing+=(KEY_ALIAS)
          [[ -n "$JUSTSHARE_KEY_PASSWORD" ]] || missing+=(KEY_PASSWORD)
          [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          [[ -n "$JUSTSHARE_REVENUECAT_API_KEY" ]] || missing+=(REVENUECAT_ANDROID_PUBLIC_SDK_KEY)
          [[ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]] || missing+=(FIREBASE_GOOGLE_SERVICES_JSON)
          if (( ${#missing[@]} )); then
            echo "Missing required testing secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: Materialize protected build inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Build signed upload bundle
        run: ./gradlew :app:bundleReleaseForUpload --stacktrace
      - name: Verify release signature
        run: |
          test -f "$AAB_PATH"
          jarsigner -verify -verbose:summary "$AAB_PATH"
      - name: Upload to the selected Play testing track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.blackandblue.justshare
          releaseFiles: ${{ env.AAB_PATH }}
          tracks: ${{ inputs.deploy_target == 'closed-alpha' && 'alpha' || 'internal' }}
          status: completed
