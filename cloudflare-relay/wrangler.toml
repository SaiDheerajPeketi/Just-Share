# ──────────────────────────────────────────────────────────────────────────────
# Just Share – Cloudflare Relay Worker  (wrangler.toml)
# ──────────────────────────────────────────────────────────────────────────────
#
# HOW TO CONFIGURE
# ─────────────────
# 1. Set the required secrets via Wrangler CLI (run once, values stored in CF):
#      npx wrangler secret put CF_RELAY_HMAC_SECRET
#        → paste a long random hex string (e.g. `openssl rand -hex 32`)
#          This must match the protected backend token-service secret.
#
# 2. Map the custom domain (after your domain is proxied through Cloudflare):
#    Uncomment the [env.production.routes] section below and set your zone.
#
# ──────────────────────────────────────────────────────────────────────────────

name            = "justshare-relay-worker"
main            = "src/index.ts"
compatibility_date = "2024-09-23"

# ── Workers account ───────────────────────────────────────────────────────────
# ── Durable Object binding ────────────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "RELAY_SESSION"
class_name = "RelayDurableObject"

[[migrations]]
tag                = "v1"
new_classes        = ["RelayDurableObject"]

# ── Environment variables (non-secret) ────────────────────────────────────────
[vars]
# Maximum combined bytes a single session may relay (default 5 GiB).
# This guards against runaway usage on the free/paid tier.
CF_RELAY_SESSION_QUOTA_BYTES = "5368709120"

# How long (seconds) we keep an abandoned session alive before expiring it.
CF_RELAY_SESSION_TTL_SECONDS = "3600"

# ── Production environment ────────────────────────────────────────────────────
[env.production]
name = "justshare-relay-worker-production"

# Uncomment and fill in once the Black and Blue domain is proxied through Cloudflare:
# proxied through Cloudflare and you've added the custom domain in the
# Workers → Custom Domains dashboard:
#
# [[env.production.routes]]
# pattern = "relay.justshare.blackandblue.co.in/v1/*"
# zone_name = "blackandblue.co.in"
