plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
}

def quotaApiBaseUrl = providers.gradleProperty("QUOTA_API_BASE_URL")
    .orElse(providers.environmentVariable("QUOTA_API_BASE_URL"))
    .orElse("")
    .get()

android {
    namespace 'com.blackandblue.justshare'
    compileSdk 35

    defaultConfig {
        applicationId "com.blackandblue.justshare"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def alterSendRelayHost = (project.findProperty("ALTERSEND_RELAY_HOST") ?: "").toString()
        def alterSendRelayPort = (project.findProperty("ALTERSEND_RELAY_PORT") ?: "41404").toString()
        def alterSendPublicRelayNodes = (project.findProperty("ALTERSEND_PUBLIC_RELAY_NODES") ?: "").toString()
        buildConfigField "String", "ALTERSEND_RELAY_HOST", "\"${alterSendRelayHost}\""
        buildConfigField "int", "ALTERSEND_RELAY_PORT", alterSendRelayPort
        buildConfigField "String", "ALTERSEND_PUBLIC_RELAY_NODES", "\"${alterSendPublicRelayNodes}\""
        buildConfigField "String", "QUOTA_API_BASE_URL", "\"${quotaApiBaseUrl}\""

        // ── Cloudflare WebSocket Relay ─────────────────────────────────────
        // CF_RELAY_BASE_URL   : wss://relay.justshare.app  (or ws://localhost:8787 for dev)
        // CF_RELAY_HMAC_SECRET: 32-byte hex — must match the Wrangler secret
        // CF_RELAY_ENABLED    : set to "true" to activate the Cloudflare relay path
        //
        // Add these to local.properties (never commit secrets to git):
        //   CF_RELAY_BASE_URL=wss://relay.justshare.app
        //   CF_RELAY_HMAC_SECRET=<your 32-byte hex>
        //   CF_RELAY_ENABLED=true
        def cfRelayBaseUrl    = (project.findProperty("CF_RELAY_BASE_URL")    ?: "").toString()
        def cfRelayHmacSecret = (project.findProperty("CF_RELAY_HMAC_SECRET") ?: "").toString()
        def cfRelayEnabled    = (project.findProperty("CF_RELAY_ENABLED")     ?: "false").toString()
        buildConfigField "String",  "CF_RELAY_BASE_URL",    "\"${cfRelayBaseUrl}\""
        buildConfigField "String",  "CF_RELAY_HMAC_SECRET", "\"${cfRelayHmacSecret}\""
        buildConfigField "boolean", "CF_RELAY_ENABLED",     cfRelayEnabled

        vectorDrawables {
            useSupportLibrary true
        }
    }

    def releaseKeystorePath = System.getenv("JUSTSHARE_KEYSTORE_PATH")
    def releaseStorePassword = System.getenv("JUSTSHARE_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("JUSTSHARE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("JUSTSHARE_KEY_PASSWORD")
    def hasReleaseSigning = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
    ].every { it != null && !it.isBlank() }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // Compose compiler for Kotlin 1.9.x
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose BOM - manages all compose versions consistently
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    // Lifecycle ViewModel for Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-android-compiler:2.51.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Room for local database (History)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // DataStore (Settings)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Lottie
    implementation 'com.airbnb.android:lottie-compose:6.4.1'

    // Remote Transfer QR code support
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // Google Play Billing Library 9.x — required for in-app purchases and subscriptions.
    // Any new app targeting Android must use v8+ by Aug 31 2026; using v9 directly.
    implementation 'com.android.billingclient:billing:9.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Timber for logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // OkHttp – used by CloudflareWebSocketTransport for the relay WebSocket connection
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

tasks.configureEach { task ->
    if (task.name in ["assembleRelease", "bundleRelease", "packageRelease"]) {
        task.doFirst {
            if (!quotaApiBaseUrl.startsWith("https://")) {
                throw new GradleException(
                    "Release builds require QUOTA_API_BASE_URL to be a production HTTPS endpoint."
                )
            }
        }
    }
}

// Allow references to generated code
kapt {
    correctErrorTypes true
    arguments {
        // Room schema export path — enables MigrationTestHelper in tests (TODO-20)
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}
